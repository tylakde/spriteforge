[package]
name = "spriteforge"
version = "1.0.0"
description = "Local 3D to sprite baker"
authors = ["SpriteForge"]
edition = "2021"
[lib]
name = "spriteforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
